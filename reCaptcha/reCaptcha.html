<html itemscope="" itemtype="http://schema.org/WebPage" lang="en-TH">
<head>
    <title>Google reCAPTCHA v3</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css">
    <script src="https://www.google.com/recaptcha/api.js?render=6LfJ7RYjAAAAACkYDdyqLV0l1sztECLjem0l0dsw"></script>

    <script>
        grecaptcha.ready(function () {
            grecaptcha.execute('6LfJ7RYjAAAAACkYDdyqLV0l1sztECLjem0l0dsw', { action: 'contact' }).then(function (token) {
                var recaptchaResponse = document.getElementById('recaptchaResponse');
                recaptchaResponse.value = token;
            });
        });
    </script>
</head>
<body>
<section class="section">
        <div class="container">
            <div class="columns">
                <div class="column is-half">

                    <form method="POST" action="form.php">

                        <h1 class="title">
                          Google reCAPTCHA v3
                        </h1>

                        <div class="field">
                            <label class="label">Name</label>
                            <div class="control">
                                <input type="text" name="name" class="input" placeholder="Name" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Message</label>
                            <div class="control">
                                <textarea name="message" class="textarea" placeholder="Message" required></textarea>
                            </div>
                        </div>

                        <div class="field is-grouped">
                            <div class="control">
                                <button type="submit" class="button is-link">Send Message</button>
                            </div>
                        </div>

                        <input type="hidden" name="recaptcha_response_check" id="recaptchaResponse">
                        
                    </form>

                </div>
            </div>
        </div>
    </section>
</body>
</html>
